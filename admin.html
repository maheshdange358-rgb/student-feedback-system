<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Student Feedback</title>

    <link rel="stylesheet" href="styl.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #1264c4;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            padding: 30px;
        }

        .title {
            color: #1264c4;
            margin-bottom: 25px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 2px 10px #ddd;
        }

        .card h3 {
            margin: 0;
            color: #555;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #1264c4;
            margin: 10px 0 0;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1264c4;
            color: white;
        }

        .rating {
            color: #f5a623;
            font-size: 18px;
        }

        .no-data {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        @media(max-width: 700px) {
            .cards {
                flex-direction: column;
            }

            .header {
                padding: 15px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <h2>Student Feedback Management System</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="feedback.html">Feedback</a>
        </div>

    </div>

    <div class="container">

        <h1 class="title">Admin Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Feedback</h3>
                <p id="totalFeedback">0</p>
            </div>

            <div class="card">
                <h3>Average Rating</h3>
                <p id="averageRating">0 ⭐</p>
            </div>

            <div class="card">
                <h3>Teachers</h3>
                <p id="totalTeachers">0</p>
            </div>

        </div>

        <div class="table-box">

            <h2>Student Feedback</h2>

            <table>

                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Enrollment No.</th>
                        <th>Teacher</th>
                        <th>Subject</th>
                        <th>Rating</th>
                        <th>Comments</th>
                    </tr>
                </thead>

                <tbody id="feedbackTable">
                </tbody>

            </table>

            <div id="noData" class="no-data">
                No feedback submitted yet.
            </div>

        </div>

    </div>

    <script>

        let feedbacks =
            JSON.parse(localStorage.getItem("feedbacks")) || [];

        document.getElementById("totalFeedback").innerText =
            feedbacks.length;

        if (feedbacks.length > 0) {

            let totalRating = 0;

            let teachers = new Set();

            feedbacks.forEach(function(feedback) {

                totalRating += Number(feedback.rating);

                teachers.add(feedback.teacher);

                let row = document.createElement("tr");

                row.innerHTML = `
                    <td>${feedback.studentName}</td>

                    <td>${feedback.enrollmentNumber}</td>

                    <td>${feedback.teacher}</td>

                    <td>${feedback.subject}</td>

                    <td class="rating">
                        ${"⭐".repeat(Number(feedback.rating))}
                    </td>

                    <td>${feedback.comments}</td>
                `;

                document.getElementById("feedbackTable")
                    .appendChild(row);

            });

            let average =
                totalRating / feedbacks.length;

            document.getElementById("averageRating")
                .innerText = average.toFixed(1) + " ⭐";

            document.getElementById("totalTeachers")
                .innerText = teachers.size;

            document.getElementById("noData")
                .style.display = "none";
        }

    </script>

</body>
</html>
