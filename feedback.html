<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Feedback</title>

    <link rel="stylesheet" href="styl.css">
</head>

<body>

<header>
    <h1>Student Feedback Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="student-login.html">Student Login</a>
        <a href="admin.html">Admin Login</a>
    </nav>
</header>


<div class="feedback-container">

    <div class="feedback-box">

        <h2>Student Feedback Form</h2>

        <form id="feedbackForm">

            <!-- Student Information -->

            <label>Student Name</label>
            <input type="text"
                   id="studentName"
                   placeholder="Enter Student Name"
                   required>

            <label>Enrollment Number</label>
            <input type="text"
                   id="enrollmentNumber"
                   placeholder="Enter Enrollment Number"
                   required>


            <hr>

            <h3>Teacher Feedback</h3>


            <!-- Teacher 1 -->

            <h4>1. Mr. Faiz Osmani</h4>

            <label>Subject</label>
            <select id="subject1" required>
                <option value="">Select Subject</option>
                <option>Operating System</option>
                <option>Software Engineering</option>
                <option>Advance Computer Network</option>
            </select>

            <label>Rating</label>

            <div class="rating">
                <label>
                    <input type="radio" name="rating1" value="1" required> ⭐
                </label>

                <label>
                    <input type="radio" name="rating1" value="2"> ⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating1" value="3"> ⭐⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating1" value="4"> ⭐⭐⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating1" value="5"> ⭐⭐⭐⭐⭐
                </label>
            </div>

            <label>Comments</label>
            <textarea id="comment1"
                      placeholder="Write your feedback"></textarea>


            <hr>


            <!-- Teacher 2 -->

            <h4>2. Mrs. Yogi P.G</h4>

            <label>Subject</label>
            <select id="subject2" required>
                <option value="">Select Subject</option>
                <option>Operating System</option>
                <option>Software Engineering</option>
                <option>Advance Computer Network</option>
            </select>

            <label>Rating</label>

            <div class="rating">
                <label>
                    <input type="radio" name="rating2" value="1" required> ⭐
                </label>

                <label>
                    <input type="radio" name="rating2" value="2"> ⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating2" value="3"> ⭐⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating2" value="4"> ⭐⭐⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating2" value="5"> ⭐⭐⭐⭐⭐
                </label>
            </div>

            <label>Comments</label>
            <textarea id="comment2"
                      placeholder="Write your feedback"></textarea>


            <hr>


            <!-- Teacher 3 -->

            <h4>3. Mrs. Tele S.N</h4>

            <label>Subject</label>
            <select id="subject3" required>
                <option value="">Select Subject</option>
                <option>Operating System</option>
                <option>Software Engineering</option>
                <option>Advance Computer Network</option>
            </select>

            <label>Rating</label>

            <div class="rating">
                <label>
                    <input type="radio" name="rating3" value="1" required> ⭐
                </label>

                <label>
                    <input type="radio" name="rating3" value="2"> ⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating3" value="3"> ⭐⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating3" value="4"> ⭐⭐⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating3" value="5"> ⭐⭐⭐⭐⭐
                </label>
            </div>

            <label>Comments</label>
            <textarea id="comment3"
                      placeholder="Write your feedback"></textarea>


            <br>

            <button type="submit">
                Submit All Feedback
            </button>

        </form>

        <p id="successMessage"></p>

    </div>

</div>


<script>

document.getElementById("feedbackForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const studentName =
        document.getElementById("studentName").value;

    const enrollmentNumber =
        document.getElementById("enrollmentNumber").value;


    const teachers = [
        {
            teacher: "Mr. Faiz Osmani",
            subject: document.getElementById("subject1").value,
            rating: document.querySelector('input[name="rating1"]:checked').value,
            comments: document.getElementById("comment1").value
        },

        {
            teacher: "Mrs. Yogi P.G",
            subject: document.getElementById("subject2").value,
            rating: document.querySelector('input[name="rating2"]:checked').value,
            comments: document.getElementById("comment2").value
        },

        {
            teacher: "Mrs. Tele S.N",
            subject: document.getElementById("subject3").value,
            rating: document.querySelector('input[name="rating3"]:checked').value,
            comments: document.getElementById("comment3").value
        }
    ];


    let feedbacks =
        JSON.parse(localStorage.getItem("feedbacks")) || [];


    teachers.forEach(function(item) {

        const feedback = {

            studentName: studentName,

            enrollmentNumber: enrollmentNumber,

            teacher: item.teacher,

            subject: item.subject,

            rating: item.rating,

            comments: item.comments

        };

        feedbacks.push(feedback);

    });


    localStorage.setItem(
        "feedbacks",
        JSON.stringify(feedbacks)
    );


    document.getElementById("successMessage").innerText =
        "✅ Feedback Successfully Submitted!";


    this.reset();

});

</script>

</body>
</html>
